  - id: NF-007
    title: Minion-Agent records only a system_base header component; no memory component is wired
    classification: INTEGRATION_CONTRACT_DEFECT
    owner_decision_required: true
    blocking: [Layer-16]
    status: OPEN
    raised_by: Claude
    sources: ["[FND §G.5]", "[FND §G.8]", "[R05 §3]", "[R05 §10]", "[IAA §12]"]
    requirements: [MINT-004, MINT-006, MINT-009]
    summary: >
      The bundle states Minion-Agent "already exposes ... a documented memory component". At
      minion-agent 3de4b75 (and at the bundle's snapshot d37171d) the record_header/assemble_system
      mechanism accepts any component names, and the master design lists a `memory` component, but
      the agent loop driver hard-codes components = {"system_base": ...}
      (agent_loop/driver.py:1095). An adapter cannot add a separate `memory` component without a
      Minion-Agent-side change. Evidence: assurance/layers/00-minion-agent-seam-audit.md.
    interpretations:
      - "Inject via PromptComposer contributed sections (exists today): memory becomes part of system_base, so the header records it only inside one combined component and loses component-level reuse/attribution."
      - "Request an additive Minion-Agent extension letting a provider contribute named header components (e.g. memory), through Minion-Agent's own process."
    recommendation: >
      Not a WP-00/WP-01 blocker. Before Layer 16 the Owner decides whether to request the
      Minion-Agent extension (preferred: it matches the master design and Mneme's
      reconstructability requirement) or to accept prompt-section injection.
    resolution_layer: "16"

  - id: NF-008
    title: Two candidate injection seams; assemble_system orders components by name
    classification: REQUIREMENT_UNCERTAIN
    owner_decision_required: false
    blocking: [Layer-16]
    status: OPEN
    raised_by: Claude
    sources: ["[IAA §12]", "[R05 §10]", "[R05 §16]"]
    requirements: [MINT-009]
    summary: >
      IAA §12 lists both the request-header memory component and PromptComposer contributed
      sections as Mneme seams. Using both would create a second, hidden injection path (kickoff
      §19 forbids that). Separately, assemble_system joins components sorted by name in both
      Python and Rust, so a `memory` component would precede `system_base` in the dispatched prompt.
    recommendation: Layer 16 contract names exactly one canonical injection path and its placement.
    resolution_layer: "16"

