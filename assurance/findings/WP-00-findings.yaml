  - id: NF-022
    title: Integer versus whole-number float is not decided, and canonical bytes cannot distinguish them
    classification: REQUIREMENT_UNCERTAIN
    owner_decision_required: true
    blocking: [Layer-01]
    status: CLOSED
    raised_by: Claude
    sources: ["[R04 §6]", "[MVP §18.1]"]
    requirements: [SER-008, SER-009, CORE-003]
    summary: >
      G-015 lists integers and finite floats as value kinds, but RFC 8785 (G-014) serializes the
      integer 1 and the float 1.0 identically ("1"), so same-version conflict detection cannot see a
      1 vs 1.0 difference (the same invisibility G-017 resolved for -0). Python and Rust both keep
      them as distinct types (probe, assurance/layers/01-feasibility-matrix.md).
    interpretations:
      - "One number kind: a whole-number float is the integer of the same value (matches JSON and RFC 8785)."
      - "Two kinds: whole-number floats are distinct and must be preserved, accepting that hashing cannot see the difference."
      - "Two kinds, but integral floats are rejected or normalized to integers at the seam."
    recommendation: Owner decision (path C) before the WP-01 contract checkpoint.
    resolution_layer: "01"
    resolution: >
      Resolved by Owner decision G-023 (SER-008 one numeric kind), reference/governance/2026-10-10-owner-layer01-decisions.md;
      contract accepted and Layer 01 certified at code cc3c5d54 / docs 71e2b12e (G-009, G-044).


