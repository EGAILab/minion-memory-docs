  - id: NF-001
    title: Knowledge Package unit-file directory is units/ in R01 but memories/ in R00 and MVP
    classification: REQUIREMENT_UNCERTAIN
    owner_decision_required: true
    blocking: [Layer-12]
    status: OPEN
    raised_by: Claude
    sources: ["[R01 §3]", "[R00 §11]", "[MVP §8]"]
    requirements: [PKG-001]
    summary: >
      R01 §3 (owner of interchange semantics) states "manifest.yaml + units/*.md + assets/*".
      R00 §11 (normative for R01) and MVP §8 (rank 2) show "memories/*.md" with "serializer name
      retained/may remain for MVP compatibility".
    interpretations:
      - "memories/ is the MVP canonical name; units/ in R01 is an editorial drift."
      - "units/ is the intended new canonical name; memories/ is accepted only as a legacy alias."
      - "Both are accepted on import; one is written."
    recommendation: >
      Authority rank favors memories/ (R00, MVP). Recommend the Owner confirm one canonical
      directory and whether the other is a read-only alias. Not needed before Layer 12.
    resolution_layer: "12"

