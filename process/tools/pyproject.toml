[project]
name = "mneme-process"
version = "0.1.0"
description = "Minion-Memory workflow mechanics and bootstrap validation (WP-00). Decides mechanical legality only; never semantics."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.2",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
sources = ["python-docx>=1.1"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
    "types-jsonschema",
    "python-docx>=1.1",
]

[project.scripts]
mneme-process = "mneme_process.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mneme_process"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["docx", "docx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# OWN-001: no cache inside the repo; temp/caches live under the E: project .tmp (see
# process/environment/project-environment.*).
addopts = "-q -p no:cacheprovider"
